name: XAUUSD Signal Monitor

on:
  schedule:
    # Jalankan setiap 5 menit, Senin-Jumat (UTC)
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:  # untuk trigger manual

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache state file (anti-spam)
        uses: actions/cache@v3
        with:
          path: state.json
          key: state-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            state-${{ github.ref_name }}-

      - name: Run monitoring script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Persist state file for next run
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update state file [skip ci]" || echo "No changes to commit"
            git push
          fi
