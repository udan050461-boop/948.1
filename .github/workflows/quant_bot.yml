name: Quant Algorithmic Trading Bot XAUUSD

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Menjalankan ulang workflow setiap 6 jam secara otomatis

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets pandas numpy requests

     - name: Run Trading Bot Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
        run: |
          python main.py
